# obc40-screensaver: the power key on the back of the OBC40 shows and hides the screensaver,
# so elogind must not shut the board down when it is pressed. Turn the board off from the home screen.
# Installed in /etc/elogind/logind.conf.d/ by "sh install.sh --system" (as root).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
